<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYLICE_CORE // WIZDON TECHNOLOGIES</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-glow: rgba(0, 255, 102, 0.4);
            --dark-bg: #020405;
            --panel-bg: rgba(6, 10, 13, 0.9);
            --border-color: rgba(0, 255, 102, 0.3);
            --accent-cyan: #00e5ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(0, 255, 102, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            touch-action: none;
        }

        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
            gap: 15px;
        }

        .splash-logo { font-size: 2rem; font-weight: bold; letter-spacing: 4px; color: var(--accent-cyan); text-shadow: 0 0 15px var(--accent-cyan); text-transform: uppercase; }
        .splash-sub { font-size: 1.1rem; letter-spacing: 2px; color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
        .splash-author { font-size: 0.85rem; opacity: 0.7; letter-spacing: 3px; margin-top: 20px; text-transform: uppercase; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; background: var(--panel-bg);
            border-bottom: 2px solid var(--neon-green);
            box-shadow: 0 0 20px var(--neon-glow);
            z-index: 10;
        }

        .brand-title { font-size: 1.3rem; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 8px var(--neon-green); }
        .dock-controls { display: flex; gap: 10px; }

        .btn-action {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 8px 14px;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-action:hover { background: var(--neon-green); color: var(--dark-bg); }

        .dashboard-container {
            display: grid; grid-template-columns: 280px 1fr;
            gap: 15px; padding: 15px; flex: 1; height: calc(100vh - 60px);
        }

        .sidebar {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 6px; padding: 15px; display: flex; flex-direction: column; gap: 15px;
            z-index: 5;
        }

        .stat-block { border-left: 3px solid var(--neon-green); padding-left: 10px; }
        .stat-label { font-size: 0.7rem; opacity: 0.75; text-transform: uppercase; }
        .stat-value { font-size: 1rem; font-weight: bold; text-shadow: 0 0 5px var(--neon-green); margin-top: 3px; }

        .viewport-panel {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 6px; display: flex; flex-direction: column; padding: 15px;
            position: relative; z-index: 5;
        }

        .neural-viewport {
            flex: 1; border: 1px solid var(--border-color);
            border-radius: 4px; background: #000; position: relative;
            overflow: hidden;
        }

        #canvas3d { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
        #canvas3d:active { cursor: grabbing; }

        .viewport-overlay {
            position: absolute; top: 10px; left: 10px; font-size: 0.7rem;
            background: rgba(0,0,0,0.8); padding: 5px 10px;
            border: 1px solid var(--border-color); pointer-events: none;
            color: var(--accent-cyan);
        }

        .command-bar {
            display: flex; gap: 8px; background: #000; padding: 10px;
            border: 1px solid var(--neon-green); border-radius: 4px; margin-top: 15px;
        }

        .command-input {
            flex: 1; background: transparent; border: none; color: var(--neon-green);
            font-size: 0.95rem; outline: none;
        }

        .btn-send { background: var(--neon-green); color: var(--dark-bg); border: none; padding: 8px 18px; font-weight: bold; cursor: pointer; }

        @media (max-width: 768px) {
            .dashboard-container { grid-template-columns: 1fr; height: auto; display: flex; flex-direction: column; }
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo">WIZDON TECHNOLOGIES</div>
        <div class="splash-sub">// ZYLICE_CORE AI SYSTEM</div>
        <div class="splash-author">MADE BY KELVIN NANDAI</div>
    </div>

    <header>
        <div class="brand-title">// ZYLICE_CORE</div>
        <div class="dock-controls">
            <button class="btn-action" onclick="loginUser()">🔑 LOGIN ACCOUNT</button>
            <button class="btn-action" onclick="alert('CP-LRM Engine Active: Zero Cloud GPU Costs')">⚙️ SYSTEM</button>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="sidebar">
            <div class="stat-block">
                <div class="stat-label">USER ACCOUNT</div>
                <div class="stat-value" id="user-display" style="font-size:0.85rem">GUEST_MODE</div>
            </div>
            <div class="stat-block">
                <div class="stat-label">TIME-BANK LEDGER (5-DAY POOL)</div>
                <div class="stat-value" id="quota-display">15.0 / 15.0 MINS</div>
                <div class="stat-label" style="font-size:0.6rem; margin-top:2px;">STATUS: SUPABASE CLOUD SYNCED</div>
            </div>
            <div class="stat-block">
                <div class="stat-label">ENGINE ARCHITECTURE</div>
                <div class="stat-value" style="color:var(--accent-cyan)">CP-LRM (ZERO-GPU)</div>
            </div>
        </div>

        <div class="viewport-panel">
            <div class="neural-viewport">
                <div class="viewport-overlay">CP-LRM REAL-TIME 3D MATRIX [DRAG & SPIN]</div>
                <canvas id="canvas3d"></canvas>
            </div>

            <div class="command-bar">
                <input type="text" class="command-input" id="user-input" placeholder="Prompt anything: 'futuristic mansion in desert'..." />
                <button class="btn-send" onclick="executeNeuralRender()">GENERATE</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://sgfunwgyfnraipoebejv.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable__5vFpNz47vJ3vVzNnKkSQw_xqVyxvYV";
        
        let dbClient = null;
        if (SUPABASE_URL && window.supabase) {
            dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            setTimeout(() => splash.style.display = 'none', 800);
        }, 2500);

        // 3D ENGINE
        const canvas = document.getElementById('canvas3d');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
        camera.position.z = 160;

        const geometry = new THREE.IcosahedronGeometry(70, 3);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff66, wireframe: true, transparent: true, opacity: 0.6 });
        const neuralMesh = new THREE.Mesh(geometry, material);
        scene.add(neuralMesh);

        const coreGeo = new THREE.SphereGeometry(30, 16, 16);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreMesh);

        function resizeCanvas() {
            const parent = canvas.parentElement;
            renderer.setSize(parent.clientWidth, parent.clientHeight);
            camera.aspect = parent.clientWidth / parent.clientHeight;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        // DIRECT TOUCH & MOUSE ROTATIONAL DRAG ENGINE
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let autoRotateSpeed = 0.005;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            neuralMesh.rotation.y += deltaX * 0.01;
            neuralMesh.rotation.x += deltaY * 0.01;
            coreMesh.rotation.y += deltaX * 0.01;
            coreMesh.rotation.x += deltaY * 0.01;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length === 0) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            neuralMesh.rotation.y += deltaX * 0.01;
            neuralMesh.rotation.x += deltaY * 0.01;
            coreMesh.rotation.y += deltaX * 0.01;
            coreMesh.rotation.x += deltaY * 0.01;

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });

        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) {
                neuralMesh.rotation.y += autoRotateSpeed;
                coreMesh.rotation.y -= autoRotateSpeed * 2;
            }
            renderer.render(scene, camera);
        }
        animate();

        // USER ACCOUNT & CLOUD QUOTA SYNC
        let activeUserEmail = null;
        let remainingMinutes = 15.0;

        async function loginUser() {
            const email = prompt("Enter your account email:");
            if (!email) return;

            activeUserEmail = email.toLowerCase().trim();
            document.getElementById('user-display').innerText = activeUserEmail;

            if (dbClient) {
                let { data, error } = await dbClient
                    .from('user_quotas')
                    .select('*')
                    .eq('user_email', activeUserEmail)
                    .single();

                if (!data) {
                    await dbClient
                        .from('user_quotas')
                        .insert([{ user_email: activeUserEmail, remaining_minutes: 15.0 }]);
                    remainingMinutes = 15.0;
                } else {
                    remainingMinutes = parseFloat(data.remaining_minutes);
                }
                updateQuotaDisplay();
                alert("Cloud Account Connected: " + activeUserEmail + "\nSynced Quota: " + remainingMinutes + " Mins");
            }
        }

        function updateQuotaDisplay() {
            document.getElementById('quota-display').innerText = remainingMinutes.toFixed(1) + " / 15.0 MINS";
        }

        async function executeNeuralRender() {
            const input = document.getElementById('user-input');
            const val = input.value.trim();
            if(!val) return;

            if(remainingMinutes >= 2.5) {
                remainingMinutes -= 2.5;
        }
            updateQuotaDisplay();

            if (dbClient && activeUserEmail) {
                await dbClient
                    .from('user_quotas')
                    .update({ remaining_minutes: remainingMinutes })
                    .eq('user_email', activeUserEmail);
            }

            alert("[WIZDON NEURAL ENGINE]: Generated render for: \"" + val + "\"\nRemaining Quota: " + remainingMinutes.toFixed(1) + " Mins.");
            input.value = '';
        }
    </script>
</body>
</html>
